---
jobs:
  freebsd:
    name: FreeBSD
    uses: sanko/workflow-testing/.github/workflows/run-vm.yml@main
    with:
      checkout_submodules: recursive
      matrix: |-
        [
          {
            "platform_name": "freebsd",
            "os": "freebsd",
            "arch": "x86_64",
            "toolchain": "gcc",
            "variant": "firefox-installed",
            "prepare": "env IGNORE_OSVERSION=yes pkg update -f && env IGNORE_OSVERSION=yes pkg install -y perl5 curl firefox"
          },
          {
            "platform_name": "freebsd",
            "os": "freebsd",
            "arch": "x86_64",
            "toolchain": "gcc",
            "variant": "no-browser-server-only",
            "prepare": "env IGNORE_OSVERSION=yes pkg update -f && env IGNORE_OSVERSION=yes pkg install -y perl5 curl"
          }
        ]
      os_version: 14.1
      task: |
        export AUTOMATED_TESTING=1 AUTHOR_TESTING=0
        export IGNORE_OSVERSION=yes
        curl -fsSL https://cpanmin.us -o /tmp/cpanmin.pl
        perl /tmp/cpanmin.pl --notest App::cpanminus Module::Build::Tiny
        rm -f /tmp/cpanmin.pl
        export PATH="$(dirname "$(perl -e 'print $^X')"):$(perl -MConfig -e 'print "$Config{sitebin}:$Config{scriptdir}:"' 2>/dev/null):/usr/local/bin:$PATH"
        command -v cpanm
        cpanm --installdeps --notest -v .
        cpanm --test-only -v .
  linux:
    name: Linux
    uses: sanko/workflow-testing/.github/workflows/run-direct.yml@main
    with:
      checkout_submodules: recursive
      matrix: |-
        [
          {
            "platform_name": "linux",
            "os": "ubuntu-24.04",
            "arch": "x86_64",
            "perl_version": "5.40.2",
            "variant": "multi-browser",
            "toolchain": "gcc",
            "prepare": "sudo apt-get update -y && sudo apt-get install -y google-chrome-stable firefox build-essential libperl-dev libcrypt-dev"
          },
          {
            "platform_name": "linux",
            "os": "ubuntu-24.04",
            "arch": "x86_64",
            "perl_version": "5.40.2",
            "variant": "chrome-only",
            "toolchain": "gcc",
            "prepare": "sudo apt-get update -y && sudo apt-get remove -y firefox && sudo apt-get install -y google-chrome-stable build-essential libperl-dev libcrypt-dev"
          },
          {
            "platform_name": "linux",
            "os": "ubuntu-24.04",
            "arch": "x86_64",
            "perl_version": "5.40.2",
            "variant": "firefox-only",
            "toolchain": "gcc",
            "prepare": "sudo apt-get update -y && sudo apt-get remove -y google-chrome-stable chromium-browser && sudo apt-get install -y firefox build-essential libperl-dev libcrypt-dev"
          },
          {
            "platform_name": "linux",
            "os": "ubuntu-24.04",
            "arch": "x86_64",
            "perl_version": "5.40.2",
            "variant": "no-browser-server-only",
            "toolchain": "gcc",
            "prepare": "sudo apt-get update -y && sudo apt-get remove -y google-chrome-stable chromium-browser firefox 2>/dev/null || true; sudo rm -f /usr/bin/google-chrome* /usr/bin/firefox* /usr/bin/chromium*; sudo apt-get install -y build-essential libperl-dev libcrypt-dev"
          },
          {
            "platform_name": "linux",
            "os": "ubuntu-24.04-arm",
            "arch": "aarch64",
            "perl_version": "5.40.2",
            "variant": "arm64-default",
            "toolchain": "gcc",
            "prepare": "sudo apt-get update -y && sudo apt-get install -y chromium-browser firefox build-essential libperl-dev libcrypt-dev"
          },
          {
            "platform_name": "linux",
            "os": "ubuntu-24.04",
            "arch": "x86_64",
            "perl_version": "5.42.0",
            "variant": "perl-5.42",
            "toolchain": "gcc",
            "prepare": "sudo apt-get update -y && sudo apt-get install -y google-chrome-stable firefox build-essential libperl-dev libcrypt-dev"
          }
        ]
      task: |
        export AUTOMATED_TESTING=1 AUTHOR_TESTING=1
        curl -L https://cpanmin.us | perl - --notest App::cpanminus
        if [ -x "$HOME/perl5/bin/cpanm" ]; then
          export PATH="$HOME/perl5/bin:$PATH"
          "$HOME/perl5/bin/cpanm" --local-lib="$HOME/perl5" --notest local::lib
          eval "$(perl -I "$HOME/perl5/lib/perl5" -Mlocal::lib)"
        fi
        command -v cpanm
        cpanm --installdeps --notest --with-suggests --with-recommends --with-configure -v .
        perl Build.PL
        ./Build
        ./Build test --v
  macos:
    name: macOS
    uses: sanko/workflow-testing/.github/workflows/run-direct.yml@main
    with:
      checkout_submodules: recursive
      matrix: |-
        [
          {
            "platform_name": "macos",
            "os": "macos-15",
            "arch": "aarch64",
            "perl_version": "5.40.2",
            "variant": "apple-silicon-5.40",
            "toolchain": "clang"
          },
          {
            "platform_name": "macos",
            "os": "macos-15",
            "arch": "aarch64",
            "perl_version": "5.42.0",
            "variant": "apple-silicon-5.42",
            "toolchain": "clang"
          },
          {
            "platform_name": "macos",
            "os": "macos-15-intel",
            "arch": "x86_64",
            "perl_version": "5.40.2",
            "variant": "intel-x86_64",
            "toolchain": "clang"
          }
        ]
      task: |
        export AUTOMATED_TESTING=1 AUTHOR_TESTING=1
        curl -L https://cpanmin.us | perl - --notest App::cpanminus
        command -v cpanm
        cpanm --installdeps --notest --with-suggests --with-recommends --with-configure -v .
        perl Build.PL
        ./Build
        ./Build test --v
  results:
    if: always()
    name: Results
    needs:
      - linux
      - macos
      - windows
      - freebsd
    uses: sanko/workflow-testing/.github/workflows/results-summary.yml@main
    with:
      title: WebUI.pm CI Matrix
  windows:
    name: Windows
    uses: sanko/workflow-testing/.github/workflows/run-direct.yml@main
    with:
      checkout_submodules: recursive
      matrix: |-
        [
          {
            "platform_name": "windows",
            "os": "windows-2022",
            "arch": "x86_64",
            "variant": "5.40.5.1-multi-browser",
            "toolchain": "gcc",
            "prepare": "curl -sL -o /c/strawberry.zip https://github.com/StrawberryPerl/Perl-Dist-Strawberry/releases/download/SP_54051_64bit/strawberry-perl-5.40.5.1-64bit-portable.zip && rm -rf /c/Strawberry; powershell -NoProfile -Command Expand-Archive -Path C:/strawberry.zip -DestinationPath C:/Strawberry -Force -ErrorAction Stop; rm -f /c/strawberry.zip"
          },
          {
            "platform_name": "windows",
            "os": "windows-2022",
            "arch": "x86_64",
            "variant": "5.42.3.1-multi-browser",
            "toolchain": "gcc",
            "prepare": "curl -sL -o /c/strawberry.zip https://github.com/StrawberryPerl/Perl-Dist-Strawberry/releases/download/SP_54231_64bit/strawberry-perl-5.42.3.1-64bit-portable.zip && rm -rf /c/Strawberry; powershell -NoProfile -Command Expand-Archive -Path C:/strawberry.zip -DestinationPath C:/Strawberry -Force -ErrorAction Stop; rm -f /c/strawberry.zip"
          },
          {
            "platform_name": "windows",
            "os": "windows-11-arm",
            "arch": "aarch64",
            "variant": "5.40.5.1-arm64",
            "toolchain": "gcc",
            "prepare": "choco install make -y; curl -sL -o /c/strawberry.zip https://github.com/StrawberryPerl/Perl-Dist-Strawberry/releases/download/SP_54051_64bit/strawberry-perl-5.40.5.1-64bit-portable.zip && rm -rf /c/Strawberry; powershell -NoProfile -Command Expand-Archive -Path C:/strawberry.zip -DestinationPath C:/Strawberry -Force -ErrorAction Stop; rm -f /c/strawberry.zip"
          }
        ]
      task: |
        export AUTOMATED_TESTING=1 AUTHOR_TESTING=1
        export PATH="/c/Strawberry/perl/site/bin:/c/Strawberry/perl/bin:/c/Strawberry/c/bin:$PATH"
        perl -e 'print qq(perl=$^X :: $^O (make=$Config{make})\n)'
        curl -L https://cpanmin.us | perl - --notest App::cpanminus
        command -v cpanm
        cpanm --installdeps --notest --with-suggests --with-recommends --with-configure -v .
        perl Build.PL
        ./Build
        ./Build test --v
name: CI Matrix
on:
  pull_request: ~
  push:
    branches:
      - main
      - master
  schedule:
    - cron: 42 5 * * 0
  workflow_dispatch: ~
permissions:
  actions: read
  contents: read
